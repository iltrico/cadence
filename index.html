<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Cadence</title>
  <meta name="description" content="Rowing machine sessions paced the way a coach would plan them.">
  <meta name="theme-color" content="#F4F6FB">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Setup -->
<main id="setup" class="screen setup">
  <header class="bar"><h1 class="wordmark">Cadence</h1><button type="button" id="historyBtn" class="pill" data-i18n="history">History</button></header>

  <div id="types" class="types" role="radiogroup" aria-label="Session" data-i18n-aria="session"></div>
  <div id="dots" class="dots" aria-hidden="true"></div>

  <section class="length" aria-label="Length" data-i18n-aria="length">
    <div class="stepper">
      <button type="button" id="minus" class="round" aria-label="Shorter" data-i18n-aria="shorter">−</button>
      <output id="amount" class="amount" aria-live="polite"></output>
      <button type="button" id="plus" class="round" aria-label="Longer" data-i18n-aria="longer">+</button>
    </div>
  </section>

  <button type="button" id="planBtn" class="plan-btn" aria-label="Show plan" data-i18n-aria="showPlan">
    <span id="strip" class="strip"></span>
  </button>

  <button type="button" id="start" class="start">Start</button>

  <div id="planSheet" class="sheet" hidden>
    <div class="sheet-card plan-card">
      <div class="sheet-head">
        <p class="sheet-title" data-i18n="plan">Plan</p>
        <button type="button" id="planClose" class="x" aria-label="Close" data-i18n-aria="close">×</button>
      </div>
      <ol id="planList" class="plan"></ol>
    </div>
  </div>
</main>

<!-- Rowing -->
<main id="row" class="screen row" data-mode="rate" hidden>
  <div class="row-head">
    <h2 id="segName" class="seg-name"></h2>
  </div>

  <div class="cue" aria-hidden="true">
    <div class="rail"><div id="fill" class="rail-fill"></div><div id="puck" class="puck"></div></div>
    <div id="stageBar" class="stage-bar"><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span></div>
  </div>

  <div id="detail" class="detail">
    <p class="rate"><span id="spm"></span><small data-i18n="spm">spm</small></p>
    <p class="stage-text" aria-live="polite"><span id="stageName" class="stage-name"></span></p>
  </div>

  <div id="centre" class="centre">
    <div id="clock" class="clock">
      <p id="segLeft" class="seg-left" aria-label="Time left in interval" data-i18n-aria="timeLeft">0:00</p>
    </div>
    <div id="countdown" class="countdown" aria-hidden="true" aria-live="assertive">
      <div class="cd-text">
        <p class="cd-label" data-i18n="nextUp">Next up</p>
        <p id="cdName" class="cd-name"></p>
        <p id="cdRate" class="cd-rate"></p>
      </div>
      <p class="cd-count"><span id="cdNum" class="cd-num">4</span><span id="cdUnit" class="cd-unit">strokes</span></p>
      <div id="cdBar" class="cd-bar"></div>
      <div id="cdFlash" class="cd-flash"></div>
    </div>
  </div>

  <dl class="stats">
    <div><dt data-i18n="totalLeft">Total left</dt><dd id="totalLeft"></dd></div>
    <div><dt data-i18n="elapsed">Elapsed</dt><dd id="elapsed"></dd></div>
    <div class="stat-next"><dt data-i18n="then">Then</dt><dd id="nextName"></dd></div>
  </dl>

  <div class="progress" aria-hidden="true"><div id="ticks" class="ticks"></div><div id="progFill" class="prog-fill"></div></div>

  <div class="controls">
    <button type="button" id="pause" class="ctl">Pause</button>
    <button type="button" id="skip" class="ctl" data-i18n="skip">Skip</button>
    <button type="button" id="end" class="ctl" data-i18n="end">End</button>
  </div>

  <div id="pausedSheet" class="sheet" hidden>
    <div class="sheet-card">
      <p class="sheet-title" data-i18n="paused">Paused</p>
      <button type="button" id="resume" class="start" data-i18n="resume">Resume</button>
    </div>
  </div>

  <div id="endSheet" class="sheet" hidden>
    <div class="sheet-card">
      <p class="sheet-title" data-i18n="endQuestion">End this session?</p>
      <button type="button" id="endYes" class="start" data-i18n="endYes">End session</button>
      <button type="button" id="endNo" class="ghost" data-i18n="keepRowing">Keep rowing</button>
    </div>
  </div>
</main>

<!-- Done -->
<main id="done" class="screen done" hidden>
  <h2 class="done-title" data-i18n="done">Session done</h2>
  <dl class="done-stats">
    <div><dt data-i18n="rowed">Rowed</dt><dd id="dTime"></dd></div>
    <div><dt data-i18n="intervals">Intervals</dt><dd id="dCount"></dd></div>
    <div><dt data-i18n="hardWork">Hard work</dt><dd id="dHard"></dd></div>
  </dl>
  <div class="done-actions">
    <button type="button" id="again" class="start" data-i18n="close">Close</button>
    <button type="button" id="doneHistory" class="ghost" data-i18n="history">History</button>
  </div>
</main>

<div id="histSheet" class="sheet" hidden>
  <div class="sheet-card plan-card hist-card">
    <div class="sheet-head">
      <div><p class="sheet-title" data-i18n="history">History</p><p id="histMeta" class="hist-meta"></p></div>
      <button type="button" id="histClose" class="x" aria-label="Close" data-i18n-aria="close">×</button>
    </div>
    <ol id="histList" class="hist"></ol>
    <div class="hist-actions">
      <button type="button" id="exportCsv" class="start" data-i18n="exportCsv">Export CSV</button>
      <button type="button" id="exportJson" class="ghost">JSON</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
